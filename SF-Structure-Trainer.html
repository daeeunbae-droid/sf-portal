<style>

.ctn{max-width:560px;margin:0 auto;padding:16px 14px 60px}

.btn{display:block;width:100%;padding:13px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s;margin-top:8px}

.bn{background:#1B3A5C;color:#fff}.bg{background:#E8A010;color:#fff}.bo{background:#fff;color:#1B3A5C;border:2px solid #1B3A5C}

.set-item{border:2px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s}

.set-title{font-size:15px;font-weight:800;color:#1B3A5C}

.topbar .q-num{font-size:13px;font-weight:800;color:#1B3A5C}.topbar .q-mode{font-size:12px;color:#fff;font-weight:700;background:#E8A010;padding:3px 10px;border-radius:6px}
.pb{background:#e2e8f0;border-radius:99px;height:6px;overflow:hidden;margin-bottom:16px}.pf{height:100%;background:linear-gradient(90deg,#1B3A5C,#E8A010);border-radius:99px;transition:width .4s}
.phase-info{font-size:12px;color:#475569;background:#f1f5f9;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.5}.phase-info b{color:#1B3A5C}
.hint-method{font-size:11px;color:#94a3b8;text-align:center;margin-bottom:10px}
.zone-lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.answer-zone{min-height:64px;border:2px dashed #1B3A5C;border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;margin-bottom:14px;background:#f8fafc;transition:border-color .2s,background .2s}
.answer-zone.empty{border-color:#cbd5e1}.answer-zone.drag-over{border-color:#1B3A5C;background:#eff6ff}
.zone-ph{font-size:12px;color:#cbd5e1;font-style:italic;padding:8px;width:100%;text-align:center}
.bank-zone{min-height:64px;background:#f1f5f9;border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;margin-bottom:14px;transition:background .2s}.bank-zone.drag-over{background:#f0f4ff}
.ck{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:2px solid;transition:transform .12s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none;line-height:1.3;touch-action:none}
.ck:active{transform:scale(.93)}.ck[draggable]{cursor:grab}.ck.dragging{opacity:.35;transform:scale(.95)}
.ck-bank{background:#fff;border-color:#cbd5e1;color:#1e293b}.ck-bank:hover{border-color:#1B3A5C;background:#f0f4ff}
.ck-ans{background:#1B3A5C;border-color:#1B3A5C;color:#fff}.ck-ans:hover{background:#152d4a}
.ck-ok{background:#f0fdf4!important;border-color:#16a34a!important;color:#15803d!important}
.ck-no{background:#fff5f5!important;border-color:#dc2626!important;color:#dc2626!important}
.drop-indicator{width:3px;min-height:36px;border-radius:3px;background:#1B3A5C;flex-shrink:0;align-self:center;animation:blink .6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.3}to{opacity:1}}
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;background:#1B3A5C;color:#fff;border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:.82;white-space:nowrap;transform:translate(-50%,-150%)}
.feedback{border-radius:10px;padding:13px 15px;margin-bottom:12px;font-size:13px;line-height:1.6}
.fb-ok{background:#f0fdf4;border:1px solid #86efac;color:#15803d}.fb-no{background:#fff5f5;border:1px solid #fca5a5;color:#b91c1c}
.fb-hint{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}.fb-trap{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af}
.expl{background:#f8fafc;border-left:3px solid #1B3A5C;border-radius:0 8px 8px 0;padding:11px 14px;margin-top:10px;font-size:12.5px;line-height:1.6;color:#334155}.expl b{color:#1B3A5C}
.gp{display:inline-block;font-size:11px;font-weight:700;background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:6px;margin:2px 3px 2px 0}
.center{text-align:center}.big-score{font-size:42px;font-weight:900;color:#E8A010;text-align:center;margin:10px 0}
.muted{color:#64748b;font-size:12px}h2.sec{font-size:16px;font-weight:800;color:#1B3A5C;margin-bottom:10px}
.attempt-dots{text-align:center;margin-bottom:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cbd5e1;margin:0 3px}.dot.used{background:#E8A010}
.back-link{font-size:12px;color:#64748b;cursor:pointer;display:inline-block;margin-bottom:8px}.back-link:hover{color:#1B3A5C}
.admin-link{font-size:12px;color:#94a3b8;background:none;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;padding:6px 16px;font-weight:600;display:block;margin:8px auto 0}
.user-tag{font-size:11px;color:#94a3b8;text-align:right;margin-bottom:6px}

.stu-item{border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.stu-item:hover{border-color:#1B3A5C;background:#f8fafc}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}

/* ===== Phase III 서술형 전용 스타일 ===== */
.hint-method{font-size:11px;color:#94a3b8;text-align:center;margin-bottom:10px}
.zone-lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.passage{font-size:13.5px;line-height:1.85;color:#334155;background:#fcfcfd;border:1px solid #eef2f7;border-radius:12px;padding:14px 15px}
.sum-box{font-size:15.5px;line-height:2.7;color:#1e293b;background:#f8fafc;border-radius:12px;padding:18px 14px;margin-bottom:16px}
.slot{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:50px;min-height:36px;margin:3px 3px;padding:4px 10px;border-radius:8px;vertical-align:middle;font-size:13.5px;font-weight:600;transition:margin .15s,box-shadow .12s,background .15s}
.slot.empty{border:2px dashed #cbd5e1;background:#fff;color:#cbd5e1}
.slot.empty.drag-over{border-color:#1B3A5C;background:#eff6ff}
/* 채워진 청크: 뚜렷한 경계 + 그림자로 구별성 강화 */
.slot.filled{border:2px solid #16335a;background:#1B3A5C;color:#fff;cursor:grab;box-shadow:0 1px 3px rgba(27,58,92,.35)}
.slot.filled:hover{background:#244b78;box-shadow:0 2px 6px rgba(27,58,92,.45)}
.slot.filled:active{cursor:grabbing}
.slot.filled.isblank{border-color:#c47f0a;background:#E8A010;box-shadow:0 1px 3px rgba(232,160,16,.4)}
.slot.filled.isblank:hover{background:#f0a91c}
.slot.dragging{opacity:.4}
.slot.ok{border-color:#16a34a!important;background:#f0fdf4!important;color:#15803d!important;box-shadow:none!important}
.slot.no{border-color:#dc2626!important;background:#fff5f5!important;color:#dc2626!important;box-shadow:none!important}
/* 삽입 막대기: 굵고 명확하게. 밀려날 방향으로 청크가 비켜남 */
.slot.insert-before{margin-left:18px}
.slot.insert-after{margin-right:18px}
.slot.insert-before::before,.slot.insert-after::after{content:"";position:absolute;top:-2px;bottom:-2px;width:6px;border-radius:3px;background:#E8A010;box-shadow:0 0 8px rgba(232,160,16,.7);z-index:5}
.slot.insert-before::before{left:-12px}
.slot.insert-after::after{right:-12px}
.slot.locked{cursor:default;opacity:.92}
.slot.locked::after{content:"🔒";font-size:9px;margin-left:4px;opacity:.55}
.bank-zone{min-height:64px;background:#f1f5f9;border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;margin-bottom:14px;transition:background .2s}
.bank-zone.drag-over{background:#fef3c7;outline:2px dashed #E8A010}
.ck-input{background:#fffbeb;border:2px dotted #E8A010;color:#92400e;display:inline-flex;align-items:center;gap:4px;padding:7px 11px;cursor:text;border-radius:10px}
.ck-input::before{content:"✎";font-size:12px;opacity:.75}
.ck-input input{border:none;background:transparent;outline:none;font-size:13.5px;font-weight:700;color:#92400e;width:108px;font-family:inherit}
.ck-input input::placeholder{color:#d6b772;font-weight:400}
.ck-input.has-word{cursor:grab;background:#fff7e6}
.ck-input.has-word::after{content:"↥ 끌어 넣기";font-size:10px;color:#b8860b;margin-left:2px;opacity:.85}
.ck-word{background:#fff7e6;border-color:#E8A010;color:#92400e}.ck-word:hover{background:#fdecc8}

.fb-ok{background:#f0fdf4;border:1px solid #86efac;color:#15803d}.fb-no{background:#fff5f5;border:1px solid #fca5a5;color:#b91c1c}

.ans-line{font-size:14px;line-height:1.7;color:#15803d;background:#f0fdf4;border-radius:10px;padding:12px 14px;margin-top:6px}
.back-link{font-size:12px;color:#64748b;cursor:pointer;display:inline-block;margin-bottom:8px}
.back-link:hover{color:#1B3A5C}

  h+=`<div class="card"><h2 class="sec">단계 선택</h2><div class="phase-info"><b>Phase I · 구조 복원</b><br>문장의 큰 뼈대(주어·동사·목적어)와 수식어 덩어리를 배열합니다.</div><button class="btn bn" onclick="startPhase('I')">Phase I 시작 (구조 복원)</button>`;
  h+=`<div class="phase-info" style="margin-top:16px"><b>Phase II · 구조 세분화 + 어법</b><br>청크를 더 잘게 나누어 배열하고 어법 포인트까지 확인합니다.</div><button class="btn bg" onclick="startPhase('II')">Phase II 시작 (세분화 + 어법)</button>`;
  if(P3.has(S.pid)){ h+=`<div class="phase-info" style="margin-top:16px"><b>Phase III · 서술형 (요약문 완성)</b><br>지문을 한 문장으로 요약합니다. 보기 어구를 순서대로 배열하고, 원문에서 찾은 한 단어를 추가합니다.</div><button class="btn bo" onclick="S.screen='phase3';R();">Phase III 시작 (서술형)</button>`; }
  h+=`</div>`;
  return h;
}
function goHome(){S.screen='home';S.pid=null;R();}
function startPhase(ph){S.phase=ph;S.qi=0;S.results=[];S.resumeData=null;checkResume(ph);}
function checkResume(ph){
  // 미완료 진행 기록이 있으면 이어하기 물어보기
  const p=curP();
  if(!DB){S.phase=ph;S.qi=0;S.results=[];S.screen='quiz';loadQ();R();return;}
  DB.ref(`structure_trainer/progress/${sKey(S.name)}/${p.id}_Phase${ph}`).once('value',snap=>{
    const v=snap.val();
    if(v&&v.results&&v.nextQi>0&&v.nextQi<p.questions.length){
      // 이어하기 선택지 표시
      S.phase=ph;S.resumeData=v;S.screen='resume';R();
    }else{
      S.phase=ph;S.qi=0;S.results=[];S.screen='quiz';loadQ();R();
    }
  },()=>{S.phase=ph;S.qi=0;S.results=[];S.screen='quiz';loadQ();R();});
}
function vResume(){
  const p=curP(),v=S.resumeData;
  const doneCnt=v.nextQi;
  return `<div class="card"><span class="back-link" onclick="backToPhase()">← 단계 선택</span>
    <h2 class="sec">이어서 하시겠어요?</h2>
    <div class="phase-info"><b>${esc(p.title)} · Phase ${S.phase}</b><br>
    지난번에 <b>${p.questions.length}문장 중 ${doneCnt}문장</b>까지 풀었어요.</div>
    <button class="btn bn" onclick="resumeStart()">이어서 하기 (${doneCnt+1}번 문장부터)</button>
    <button class="btn bo" onclick="freshStart()">처음부터 다시</button></div>`;
}
function resumeStart(){const v=S.resumeData;S.results=v.results||[];S.qi=v.nextQi;S.screen='quiz';loadQ();R();}
function freshStart(){S.qi=0;S.results=[];S.resumeData=null;S.screen='quiz';loadQ();R();}
function curP(){return DATA.passages.find(x=>x.id===S.pid);}
function curQ(){return curP().questions[S.qi];}
function curPhaseData(){const q=curQ();return S.phase==='I'?q.phaseI:q.phaseII;}
function loadQ(){const pd=curPhaseData();S.answerOrder=pd.chunks.slice();S.bank=shuffle(pd.chunks.map((c,i)=>({c,i})));S.placed=[];S.attempt=0;S.done=false;}

function ckHtml(it,zone,pos){
  const drag=S.done?'':'draggable="true"';let cls='ck ';
  if(zone==='ans')cls+=S.done?(it.i===pos?'ck-ok':'ck-no'):'ck-ans';else cls+='ck-bank';
  const clk=S.done?'':`onclick="ckTap('${zone}',${pos})"`;
  return `<span class="${cls}" data-zone="${zone}" data-pos="${pos}" ${drag} ${clk}>${esc(it.c)}</span>`;
}
function vQuiz(){
  const p=curP(),pd=curPhaseData(),total=p.questions.length,prog=Math.round((S.qi/total)*100);
  let h=`<div class="card"><span class="back-link" onclick="backToPhase()">← 단계 선택</span><div class="topbar"><span class="q-num">${esc(p.title)} · ${S.qi+1}/${total}문장</span><span class="q-mode">Phase ${S.phase}</span></div><div class="pb"><div class="pf" style="width:${prog}%"></div></div>`;
  h+=`<div class="phase-info">${S.phase==='I'?'<b>구조 복원:</b> 큰 덩어리를 자연스러운 순서로 배열하세요.':'<b>세분화 배열:</b> 잘게 나뉜 청크를 정확한 순서로 배열하세요.'} ${esc(pd.goal||'')}</div>`;
  h+=`<div class="hint-method">청크를 <b>탭</b>하거나 <b>드래그</b>해서 옮길 수 있어요</div>`;
  h+=`<div class="zone-lbl">내가 만든 순서</div><div class="answer-zone${S.placed.length?'':' empty'}" id="ansZone" data-zone="ans">`;
  if(!S.placed.length)h+=`<div class="zone-ph">아래 청크를 눌러 순서대로 배열하세요</div>`;
  else S.placed.forEach((it,idx)=>{h+=ckHtml(it,'ans',idx);});
  h+=`</div>`;
  if(!S.done){
    h+=`<div class="zone-lbl">청크 보기</div><div class="bank-zone" id="bankZone" data-zone="bank">`;
    if(!S.bank.length)h+=`<div class="zone-ph">모두 배열했습니다</div>`;
    else S.bank.forEach((it,bi)=>{h+=ckHtml(it,'bank',bi);});
    h+=`</div><div class="attempt-dots">`;
    for(let i=0;i<2;i++)h+=`<span class="dot${i<S.attempt?' used':''}"></span>`;
    h+=` <span class="muted">시도 ${S.attempt}/2</span></div>`;
  }
  h+=`<div id="fbArea"></div>`;
  if(!S.done)h+=`<button class="btn bn" id="checkBtn" onclick="checkAnswer()" ${S.placed.length===S.answerOrder.length?'':'disabled'}>채점하기</button><button class="btn bGray" onclick="resetPlaced()">다시 배열</button>`;
  else{const last=S.qi>=p.questions.length-1;h+=`<button class="btn bGreen" onclick="nextQ()">${last?'결과 보기':'다음 문장 →'}</button>`;}
  return h+`</div>`;
}
function ckTap(zone,pos){if(S.done)return;if(zone==='bank'){const it=S.bank[pos];S.bank.splice(pos,1);S.placed.push(it);}else{const it=S.placed[pos];S.placed.splice(pos,1);S.bank.push(it);}R();}
function resetPlaced(){const pd=curPhaseData();S.bank=shuffle(pd.chunks.map((c,i)=>({c,i})));S.placed=[];R();}
function backToPhase(){S.screen='phase';R();}
function moveChunk(srcZone,srcPos,dstZone,dstPos){let it;if(srcZone==='bank'){it=S.bank[srcPos];S.bank.splice(srcPos,1);}else{it=S.placed[srcPos];S.placed.splice(srcPos,1);}if(srcZone===dstZone&&srcPos<dstPos)dstPos--;if(dstZone==='bank'){if(dstPos<0||dstPos>S.bank.length)dstPos=S.bank.length;S.bank.splice(dstPos,0,it);}else{if(dstPos<0||dstPos>S.placed.length)dstPos=S.placed.length;S.placed.splice(dstPos,0,it);}R();}

function bindDnd(){
  if(S.done)return;
  document.querySelectorAll('.ck[draggable]').forEach(el=>{el.addEventListener('dragstart',onDS);el.addEventListener('dragend',onDE);el.addEventListener('dragover',onCDO);el.addEventListener('drop',onCD);el.addEventListener('touchstart',onTS,{passive:false});});
  const az=$('ansZone'),bz=$('bankZone');
  if(az){az.addEventListener('dragover',e=>{e.preventDefault();az.classList.add('drag-over');});az.addEventListener('dragleave',e=>{if(!az.contains(e.relatedTarget))az.classList.remove('drag-over');});az.addEventListener('drop',onZD);}
  if(bz){bz.addEventListener('dragover',e=>{e.preventDefault();bz.classList.add('drag-over');});bz.addEventListener('dragleave',e=>{if(!bz.contains(e.relatedTarget))bz.classList.remove('drag-over');});bz.addEventListener('drop',onBD);}
}
function onDS(e){const el=e.currentTarget;D.srcZone=el.dataset.zone;D.srcPos=+el.dataset.pos;D.active=true;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x');setTimeout(()=>el.classList.add('dragging'),0);}
function onDE(){D.active=false;document.querySelectorAll('.ck.dragging').forEach(el=>el.classList.remove('dragging'));document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));}
function onCDO(e){e.preventDefault();e.stopPropagation();const t=e.currentTarget;document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());const rect=t.getBoundingClientRect();const ind=document.createElement('div');ind.className='drop-indicator';if(e.clientX<rect.left+rect.width/2)t.parentNode.insertBefore(ind,t);else t.parentNode.insertBefore(ind,t.nextSibling);}
function onCD(e){e.preventDefault();e.stopPropagation();if(!D.active)return;const t=e.currentTarget;const dstZone=t.dataset.zone;let dstPos=+t.dataset.pos;const rect=t.getBoundingClientRect();if(e.clientX>=rect.left+rect.width/2)dstPos++;moveChunk(D.srcZone,D.srcPos,dstZone,dstPos);}
function onZD(e){e.preventDefault();if(!D.active)return;if(e.target.id==='ansZone'||e.target.classList.contains('zone-ph'))moveChunk(D.srcZone,D.srcPos,'ans',S.placed.length);}
function onBD(e){e.preventDefault();if(!D.active)return;if(e.target.id==='bankZone'||e.target.classList.contains('zone-ph'))moveChunk(D.srcZone,D.srcPos,'bank',S.bank.length);}
function onTS(e){const el=e.currentTarget;T.el=el;T.srcZone=el.dataset.zone;T.srcPos=+el.dataset.pos;T.startX=e.touches[0].clientX;T.startY=e.touches[0].clientY;T.moved=false;T.active=false;document.addEventListener('touchmove',onTM,{passive:false});document.addEventListener('touchend',onTE,{passive:false});}
function onTM(e){const dx=e.touches[0].clientX-T.startX,dy=e.touches[0].clientY-T.startY;if(!T.active&&Math.hypot(dx,dy)>8){T.active=true;T.moved=true;T.el.classList.add('dragging');const g=document.createElement('div');g.id='drag-ghost';g.textContent=T.el.textContent.trim();document.body.appendChild(g);T.ghost=g;}if(T.active){e.preventDefault();const x=e.touches[0].clientX,y=e.touches[0].clientY;if(T.ghost){T.ghost.style.left=x+'px';T.ghost.style.top=y+'px';}document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());const tgt=document.elementFromPoint(x,y);const ck=tgt&&tgt.closest&&tgt.closest('.ck');if(ck&&ck!==T.el&&ck.dataset.zone){const rect=ck.getBoundingClientRect();const ind=document.createElement('div');ind.className='drop-indicator';if(x<rect.left+rect.width/2)ck.parentNode.insertBefore(ind,ck);else ck.parentNode.insertBefore(ind,ck.nextSibling);}}}
function onTE(e){document.removeEventListener('touchmove',onTM);document.removeEventListener('touchend',onTE);if(T.active){const t=e.changedTouches[0],x=t.clientX,y=t.clientY;const tgt=document.elementFromPoint(x,y);let dstZone=null,dstPos=-1;const ck=tgt&&tgt.closest&&tgt.closest('.ck');const zone=tgt&&tgt.closest&&tgt.closest('[data-zone]');if(ck&&ck.dataset.zone){dstZone=ck.dataset.zone;dstPos=+ck.dataset.pos;const rect=ck.getBoundingClientRect();if(x>=rect.left+rect.width/2)dstPos++;}else if(zone&&zone.dataset.zone){dstZone=zone.dataset.zone;dstPos=(dstZone==='ans')?S.placed.length:S.bank.length;}if(T.ghost)T.ghost.remove();if(T.el)T.el.classList.remove('dragging');document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());if(dstZone)moveChunk(T.srcZone,T.srcPos,dstZone,dstPos);else R();}T.active=false;T.el=null;T.ghost=null;T.moved=false;}

function checkAnswer(){if(S.placed.length!==S.answerOrder.length)return;S.attempt++;const correct=S.placed.every((it,idx)=>it.i===idx);const pd=curPhaseData();if(correct){S.done=true;S.results.push({qi:S.qi,attempts:S.attempt,correct:true});saveProgress();R();showFeedback('ok');return;}const trap=detectTrap(pd);if(S.attempt>=2){S.done=true;S.results.push({qi:S.qi,attempts:S.attempt,correct:false});saveProgress();R();showFeedback('reveal',trap);}else{R();showFeedback(trap?'trap':'hint',trap);}}
function saveProgress(){
  if(!DB)return;const p=curP();
  try{DB.ref(`structure_trainer/progress/${sKey(S.name)}/${p.id}_Phase${S.phase}`).set({
    name:S.name,passageId:p.id,passageTitle:p.title,phase:S.phase,
    nextQi:S.qi+1,total:p.questions.length,
    results:S.results.map(r=>({qi:r.qi,attempts:r.attempts,correct:r.correct})),
    date:new Date().toISOString()
  });}catch(e){console.warn('progress save fail',e);}
}
function detectTrap(pd){if(!pd.attachmentTraps||!pd.attachmentTraps.length)return null;for(const tr of pd.attachmentTraps){const ci=S.placed.findIndex(it=>it.c===tr.chunk);const wi=S.placed.findIndex(it=>it.c.indexOf(tr.wrongAfter)>=0||tr.wrongAfter.indexOf(it.c)>=0);if(ci>=0&&wi>=0&&ci===wi+1)return tr;}return null;}
function showFeedback(type,trap){const fb=$('fbArea');if(!fb)return;const q=curQ();let h='';if(type==='ok'){h=`<div class="feedback fb-ok">정확합니다! 구조를 제대로 복원했어요.${S.attempt>1?' ('+S.attempt+'번째 시도)':''}</div>`+explHtml(q);}else if(type==='trap'){h=`<div class="feedback fb-trap"><b>수식어 위치를 다시 보세요.</b><br>${esc(trap.hint)}</div><div class="feedback fb-hint">다시 한 번 배열해 보세요. (시도 ${S.attempt}/2)</div>`;}else if(type==='hint'){h=`<div class="feedback fb-hint"><b>아직 순서가 맞지 않아요.</b><br>${S.phase==='I'?'먼저 핵심 뼈대(주어·동사)를 앞에 놓고, 수식어 덩어리가 어디 붙는지 생각해 보세요.':'각 청크의 역할(주어·동사·목적어·수식어)을 떠올리며 순서를 다시 잡아 보세요.'} (시도 ${S.attempt}/2)</div>`;}else if(type==='reveal'){if(trap)h=`<div class="feedback fb-trap"><b>수식어 위치 힌트:</b><br>${esc(trap.hint)}</div>`;h+=`<div class="feedback fb-no"><b>정답을 확인하세요.</b><br>아래가 올바른 순서입니다.</div>`+correctOrderHtml()+explHtml(q);}fb.innerHTML=h;}
function correctOrderHtml(){const pd=curPhaseData();let h=`<div class="zone-lbl" style="margin-top:8px">정답 순서</div><div class="answer-zone">`;pd.chunks.forEach(c=>{h+=`<span class="ck ck-ok">${esc(c)}</span>`;});return h+`</div>`;}
function explHtml(q){const pd=curPhaseData();let h=`<div class="expl"><b>구조 해설:</b> ${esc(q.explanation)}`;if(S.phase==='II'&&pd.grammarPoints&&pd.grammarPoints.length){h+=`<div style="margin-top:8px">`;pd.grammarPoints.forEach(g=>{h+=`<span class="gp">${esc(g.type)}</span>`;});h+=`</div><div style="margin-top:6px;font-size:12px">`;pd.grammarPoints.forEach(g=>{h+=`· ${esc(g.note)}<br>`;});h+=`</div>`;}return h+`</div>`;}
function nextQ(){const p=curP();if(S.qi>=p.questions.length-1){saveResult();S.screen='setdone';R();return;}S.qi++;loadQ();R();}

// ===== Firebase 결과 저장 (structure_trainer/results/{name}/{pid}_Phase{ph}_{ts}) =====
function saveResult(){
  if(!DB){console.warn('DB 없음 — 저장 생략');return;}
  const p=curP(),tot=S.results.length,ok=S.results.filter(r=>r.correct).length;
  const firstTry=S.results.filter(r=>r.correct&&r.attempts===1).length,pct=Math.round(ok/tot*100);
  // 통일 스키마: phase 숫자화 + firstPct(첫시도 정답률, 실력지표) + passageNum + completedAt
  const phaseNum = (S.phase==='I')?1:(S.phase==='II')?2:Number(S.phase)||0;
  const passageNum = passageNumOf(p.id);
  const firstPct = tot?Math.round(firstTry/tot*100):0;
  const ts=Date.now();
  try{
    DB.ref(`structure_trainer/results/${sKey(S.name)}/${p.id}_Phase${phaseNum}_${ts}`).set({
      name:S.name,passageId:p.id,passageNum:passageNum,passageTitle:p.title,phase:phaseNum,
      firstCorrect:firstTry,total:tot,firstPct:firstPct,
      completedAt:ts,
      correct:ok,pct:pct,
      detail:S.results.map(r=>({qi:r.qi,attempts:r.attempts,correct:r.correct})),
      date:new Date().toISOString()
    });
    // 완료했으니 진행 임시저장 제거
    DB.ref(`structure_trainer/progress/${sKey(S.name)}/${p.id}_Phase${S.phase}`).remove();
  }catch(e){console.warn('save fail',e);}
}
// 지문 id(mock_2026_03_NN[_MM])에서 대표 번호 추출
function passageNumOf(pid){
  const m=String(pid||'').match(/mock_\d{4}_\d{2}_(\d{2})/);
  return m?Number(m[1]):0;
}

function vSetDone(){
  const p=curP(),tot=S.results.length,ok=S.results.filter(r=>r.correct).length;
  const firstTry=S.results.filter(r=>r.correct&&r.attempts===1).length,pct=Math.round(ok/tot*100);
  let h=`<div class="card center"><h2 class="sec">Phase ${S.phase} 완료!</h2><div class="muted">${esc(p.title)} · ${esc(S.name)}님</div><div class="big-score">${pct}%</div><div class="muted">${tot}문장 중 ${ok}문장 정답 · 첫 시도 정답 ${firstTry}문장</div>${DB?'<div class="muted" style="margin-top:6px;color:#16a34a">✓ 기록이 저장되었습니다</div>':'<div class="muted" style="margin-top:6px;color:#dc2626">기록 저장 안 됨(오프라인)</div>'}</div><div class="card">`;
  if(S.phase==='I')h+=`<div class="phase-info"><b>다음 단계 추천:</b> 구조가 보였다면 Phase II로 더 세밀하게 나누고 어법까지 확인해 보세요.</div><button class="btn bg" onclick="startPhase('II')">Phase II 도전 (세분화 + 어법)</button>`;
  else h+=`<div class="phase-info">수고했습니다! 다른 지문도 훈련해 보세요.</div>`;
  h+=`<button class="btn bo" onclick="startPhase('${S.phase}')">Phase ${S.phase} 다시 풀기</button><button class="btn bGray" onclick="goHome()">지문 목록으로</button></div>`;

function vAdmin(){
  const el=$('app');
  el.innerHTML=`<div class="card"><span class="back-link" onclick="logout()">← 로그아웃</span><h2 class="sec">🔐 관리자 — 학생 훈련 현황</h2><div class="muted" id="adminStatus">불러오는 중...</div></div><div id="adminBody"></div>`;
  if(!DB){$('adminStatus').textContent='Firebase 연결 안 됨 — 기록을 불러올 수 없습니다.';return;}
  Promise.all([
    DB.ref('structure_trainer/results').once('value'),
    DB.ref('structure_trainer/progress').once('value')
  ]).then(([rs,ps])=>{
    const data=rs.val()||{};const prog=ps.val()||{};
    window.__progAll=prog;
    const names=[...new Set([...Object.keys(data),...Object.keys(prog)])];
    if(!names.length){$('adminStatus').textContent='아직 저장된 훈련 기록이 없습니다.';return;}
    $('adminStatus').textContent=`총 ${names.length}명의 학생 기록`;
    let h='<div class="card">';
    // 학생별 요약
    const stuSummary=names.map(nk=>{
      const recs=data[nk]?Object.values(data[nk]):[];
      const progRecs=prog[nk]?Object.values(prog[nk]):[];
      const nm=(recs[0]||progRecs[0]||{}).name||nk;
      const cnt=recs.length;
      const inProg=progRecs.length;
      const allDates=[...recs.map(r=>r.date),...progRecs.map(r=>r.date)];
      const last=allDates.reduce((mx,d)=>d>mx?d:mx,'');
      const avgPct=cnt?Math.round(recs.reduce((s,r)=>s+(r.pct||0),0)/cnt):0;
      return {nk,nm,cnt,inProg,last,avgPct};
    }).sort((a,b)=>b.last.localeCompare(a.last));
    stuSummary.forEach(s=>{
      const col=s.avgPct>=80?'#16a34a':s.avgPct>=60?'#E8A010':'#dc2626';
      const dt=s.last?new Date(s.last).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'-';
      const progBadge=s.inProg?` · <span style="color:#E8A010">진행중 ${s.inProg}</span>`:'';
      h+=`<div class="stu-item" onclick="adminStudent('${esc(s.nk)}')">
        <div><div style="font-weight:800;color:#1B3A5C">${esc(s.nm)}</div><div class="muted">완료 ${s.cnt}회${progBadge} · 최근 ${dt}</div></div>
        <div class="pill" style="background:${col}22;color:${col}">${s.cnt?('평균 '+s.avgPct+'%'):'미완료'}</div></div>`;
    });

function adminStudent(nk){
  const el=$('app');
  el.innerHTML=`<div class="card"><span class="back-link" onclick="S.screen='admin';R()">← 학생 목록</span><h2 class="sec" id="stuName">학생 상세</h2></div><div id="stuBody"><div class="card muted">불러오는 중...</div></div>`;
  Promise.all([
    DB.ref(`structure_trainer/results/${nk}`).once('value'),
    DB.ref(`structure_trainer/progress/${nk}`).once('value')
  ]).then(([rs,ps])=>{
    const data=rs.val()||{};const prog=ps.val()||{};
    const recs=Object.values(data).map(r=>({...r,_done:true}));
    const progs=Object.values(prog).map(r=>({...r,_done:false,
      correct:(r.results||[]).filter(x=>x.correct).length,
      firstTry:(r.results||[]).filter(x=>x.correct&&x.attempts===1).length,
      pct:Math.round(((r.results||[]).filter(x=>x.correct).length/((r.results||[]).length||1))*100)
    }));
    const all=[...recs,...progs].sort((a,b)=>b.date.localeCompare(a.date));
    const nm=(recs[0]||progs[0]||{}).name||nk;
    $('stuName').textContent=nm+' — 훈련 기록';
    window.__stuRecs=all;
    let h='<div class="card"><table class="tbl"><tr><th>지문</th><th>단계</th><th>정답</th><th>진행</th><th>날짜</th></tr>';
    all.forEach((r,i)=>{
      const col=r.pct>=80?'#16a34a':r.pct>=60?'#E8A010':'#dc2626';
      const dt=new Date(r.date).toLocaleDateString('ko-KR',{month:'short',day:'numeric'})+' '+new Date(r.date).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const doneTxt=r._done?'<span style="color:#16a34a;font-weight:700">완료</span>':`<span style="color:#E8A010;font-weight:700">진행중 ${r.nextQi||r.correct}/${r.total}</span>`;
      const cntDisp=r._done?`${r.correct}/${r.total} (${r.pct}%)`:`${r.correct}/${(r.results||[]).length||0}`;
      h+=`<tr style="cursor:pointer" onclick="adminDetail(${i})"><td>${esc(r.passageTitle)}</td><td>Phase ${r.phase}</td><td style="color:${col};font-weight:700">${cntDisp}</td><td>${doneTxt}</td><td class="muted">${dt}</td></tr>`;
    });
    h+='</table><div class="muted" style="margin-top:8px">행을 누르면 문장별 상세를 볼 수 있어요</div></div>';
    $('stuBody').innerHTML=h;
  });
}
function adminDetail(i){
  const r=(window.__stuRecs||[])[i];if(!r)return;
  const p=DATA.passages.find(x=>x.id===r.passageId);
  const det=r.detail||r.results||[];
  let h=`<div class="card"><span class="back-link" onclick="adminStudent('${sKey(r.name)}')">← 기록 목록</span>
    <h2 class="sec">${esc(r.passageTitle)} · Phase ${r.phase}</h2>
    <div class="muted" style="margin-bottom:10px">${r._done?'완료':'진행중'} · ${esc(r.name)}</div>
    <table class="tbl"><tr><th>문장</th><th>결과</th><th>시도</th></tr>`;
  const total=r.total||(p?p.questions.length:det.length);
  for(let qi=0;qi<total;qi++){
    const d=det.find(x=>x.qi===qi);
    let res,sty;
    if(!d){res='미완료';sty='color:#94a3b8';}
    else if(d.correct){res='정답';sty='color:#16a34a;font-weight:700';}
    else{res='오답';sty='color:#dc2626;font-weight:700';}
    const att=d?(d.attempts+'회'):'-';
    h+=`<tr><td>${qi+1}번 문장</td><td style="${sty}">${res}</td><td>${att}</td></tr>`;
  }
  h+='</table></div>';
  $('app').innerHTML=h;
}

s that your body has a stable quantity of fat cells by the time you are an adult. The more weight you carried in your childhood and your teenage years, the more fat cells you will have as an adult. These fat cells then become \"fuller\" or \"thinner\" as you gain and lose weight as an adult. The set point is the trigger in these cells that will send a message to your brain saying that your fat cells are getting too thin and that you must eat more. Different people's fat cells will have different set points, and the strength of the message is affected by the number of cells. Thus a person with lots of fat cells and a high set point will battle with a strong desire for food when dieting.","sum":"The more _______ _______, the stronger the _______ _______ _______ when dieting","bogi":["a person has","becomes","fat cells","for food"],"answerSeq":["fat cells","a person has","__BLANK__","for food","becomes"],"hasBlank":true,"addWord":"desire","answer":"The more fat cells a person has, the stronger the desire for food becomes when dieting.","exp":"","acceptVariants":{}},"36":{"num":36,"title":"26년 3월 고1 36번","stem":"(A)글을 한 문장으로 요약할 때, <보기>의 어구를 모두 한 번씩 사용하고(필요시 어법에 맞게 형태를 바꿀 것) 의미상 필요한 한 단어를 원문에서 찾아 추가하여, (B)요약문을 완성하시오.","passage":"Initially the catchphrase \"less is more\" had a simple meaning. First mentioned in Robert Browning's poem \"Andrea del Sarto,\" it suggests that everything simple is better and more beautiful than the complex and tangled. Nowadays this phrase is heard often -- maybe even too often. But it's important to recognize that the way of thinking that lies behind these words slowly extinguishes certain habits from our daily life. For example, think about the heavy, massive radio receivers that existed back in the day. Over time, many of their buttons became viewed as \"extra\" and were removed, and with each reduction these devices eventually developed into the phones in our pockets. The scale of the object became smaller, and the functions of the butto e \"musts\" take more of the parents' time or money to navigate, because the child can't do it on their own. As Darby Saxbe, a clinical psychologist, recently wrote in the New York Times, \"underparenting requires structural change.\" Unlike most political experts, she's not just talking about economic policies like family leave and government-supported childcare. She's talking about actual physical structures, and the cultural change required to populate them. We need to \"build back our tolerance for children in public spaces,\" she writes, \"and create safe environments where lightly supervised kids can move around freely.\"","sum":"Children's independence _______ _______ _______, so experts _______ _______ _______ _______ _______","bogi":["structural","environments","economic policies","is limited","rather than","call for","by urban"],"answerSeq":["is limited","by urban","environments","call for","structural","__BLANK__","rather than","economic policies"],"hasBlank":true,"addWord":"change","answer":"Children's independence is limited by urban environments, so experts call for structural change rather than economic policies.","exp":"","acceptVariants":{}},"41":{"num":41,"title":"26년 3월 고1 41번","stem":"(A)글을 한 문장으로 요약할 때, <보기>의 어구를 모두 한 번씩 사용하고(필요시 어법에 맞게 형태를 바꿀 것) 의미상 필요한 한 단어를 원문에서 찾아 추가하여, (B)요약문을 완성하시오.","passage":"It's fair to say that patience has a terrible name. For one thing, the prospect of doing anything that you've been told will require patience simply seems unattractive. More specifically, though, it's disturbingly passive. It is the virtue that has traditionally been urged upon housewives, while their husbands led more exciting lives outside the home; or on racial minorities, told to wait just a few more decades for their full civil rights. The talented but self-effacing employee who 'waits patiently' for a promotion, we tend to feel, will be waiting a long time: she ought to be trumpeting her achievements instead. In all such cases, patience is a way of psychologically accommodating yourself to a lack of power, an attitude intended to help you to resign yourself to your lowly position, in theoretical hopes of better days to come. But as society accelerates, something shifts. In more and more contexts, patience becomes a form of power. In a world geared for hurry, the capacity to resist the urge to hurry -- to allow things to take the time they take -- is a way to gain purchase on the world, to do the work that counts, and to derive satisfaction from the doing itself, instead of putting off all your fulfillment to the future.","sum":"Although _______ _______ _______ _______ to a lack of power, it _______ _______ _______ as society accelerates","bogi":["seen as","a form of","patience","passive accommodation","was traditionally","becomes"],"answerSeq":["patience","was traditionally","seen as","passive accommodation","becomes","a form of","__BLANK__"],"hasBlank":true,"addWord":"power","answer":"Although patience was traditionally seen as passive accommodation to a lack of power, it becomes a form of power as society accelerates.","exp":"","acceptVariants":{}}}};

function init(){
  D=DATA.passages[curKey];
  // sum 분해 → 슬롯 앞 고정텍스트
  const parts=D.sum.split(/(_{3,})/);
  const slotMeta=[]; let buf='';
  for(const p of parts){ if(/^_{3,}$/.test(p)){slotMeta.push(buf);buf='';} else buf+=p; }
  slots = D.answerSeq.map((_,i)=>({idx:i,type:'drop',fixedBefore:slotMeta[i]||'',placed:null,locked:false}));
  // 뱅크: 보기 청크 + (hasBlank면) 점선 입력 청크 1개, 섞기
  const items = D.bogi.map(t=>({kind:'chunk',text:t}));
  if(D.hasBlank) items.push({kind:'input'});
  bank = shuffle(items);
  blankWord='';
  graded=false;
  firstScored=false; firstCorrect=0; firstTotal=0; savedThisRound=false;
  render();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  h+=`<div class="card"><span class="back-link" onclick="P3.back()">← 지문 목록</span>

  const hintText = D.hasBlank

    : '보기 어구를 끌어다 빈칸에 순서대로 놓으세요.';
  h+=`<div class="card">

    <div class="zone-lbl">요약문 (B)</div>
    <div class="sum-box" id="sumBox">${renderSum()}</div>

    <div class="zone-lbl">보기 어구</div>
    <div class="bank-zone" id="bank">${renderBank()}</div>

    <div id="fb"></div>
    <div id="ctrl"></div>
  </div>`;
  document.getElementById('app').innerHTML=h;

  bindBank(); bindSlots(); bindInput();

function renderSum(){
  let h='';
  slots.forEach((s,i)=>{
    if(s.fixedBefore) h+=`<span>${esc(s.fixedBefore)}</span>`;
    if(s.placed){
      const isBlank = s.placed.kind==='word';
      let cls='filled'+(isBlank?' isblank':'');
      if(s.locked) cls+=' ok locked';                 // 맞아서 잠긴 칸
      else if(graded) cls+=(isPlacedCorrect(i)?' ok':' no');
      const drag = s.locked ? '' : 'draggable="true" data-act="remove"';
      h+=`<span class="slot ${cls}" data-slot="${i}" ${drag}>${esc(s.placed.text)}</span>`;
    } else {
      h+=`<span class="slot empty" data-slot="${i}"></span>`;
    }
  });
  return h;
}

function renderBank(){
  if(bank.length===0) return `<span class="bank-empty">보기를 모두 배치했어요</span>`;
  return bank.map((it,i)=>{
    if(it.kind==='input'){
      const hw = blankWord.trim()!=='' ? ' has-word' : '';
      return `<span class="ck ck-input${hw}" data-bank="${i}"><input id="blankIn" type="text"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="원문에서 한 단어" value="${esc(blankWord)}"></span>`;
    }
    const wc = it.kind==='word'?'ck-word':'ck-bank';
    return `<span class="ck ${wc}" draggable="true" data-bank="${i}">${esc(it.text)}</span>`;
  }).join('');
}

function renderCtrl(){
  const ctrl=document.getElementById('ctrl');

      ctrl.innerHTML=`<button class="btn bGreen" onclick="P3.resetAll()">✓ 정답! 처음부터 다시 풀기</button>`;

    }
    return;
  }
  // 풀이/수정 중: 빈 슬롯(잠기지 않은)이 모두 채워지면 채점 가능
  const ready = slots.every(s=> s.locked || s.placed!==null );
  ctrl.innerHTML=`<button class="btn bn" id="checkBtn" onclick="P3.checkAnswer()" ${ready?'':'disabled'}>채점하기</button>
    <button class="btn bGray" onclick="P3.resetAll()">처음부터 다시</button>`;
}

/* ===== 채점 ===== */
function isPlacedCorrect(i){
  const want=D.answerSeq[i], got=slots[i].placed;
  if(!got) return false;
  if(want==='__BLANK__') return got.kind==='word' && norm(got.text)===norm(D.addWord);
  if(got.kind!=='chunk') return false;
  if(got.text===want) return true;
  // 어법 변형 인정(acceptVariants): 보기 원형이 want인데, 정답에서 변형형도 허용
  const av=D.acceptVariants&&D.acceptVariants[want];
  if(av && av.some(v=>norm(v)===norm(got.text))) return true;
  return false;
}
function norm(s){return (s||'').trim().toLowerCase();}
function isAllCorrect(){ return slots.every((_,i)=>isPlacedCorrect(i)); }

    const pct=firstTotal?Math.round(firstCorrect/firstTotal*100):0;
    const savedMsg = (typeof DB!=='undefined'&&DB)
      ? `<div class="muted" style="margin-top:6px;color:#16a34a">✓ 기록이 저장되었습니다 (첫 정답률 ${pct}% · ${firstCorrect}/${firstTotal})</div>`
      : `<div class="muted" style="margin-top:6px;color:#dc2626">기록 저장 안 됨(오프라인)</div>`;
    fb.innerHTML=`<div class="feedback fb-ok">정답입니다! 🎉 순서와 추가 단어 모두 정확해요.
      <div class="ans-line">${esc(D.answer)}</div>${savedMsg}</div>`;
  } else {
    const nWrong = slots.filter((_,i)=>!isPlacedCorrect(i)).length;
    let msg=`<div class="feedback fb-no">${nWrong}곳이 틀렸어요. <b>틀린 곳만 고치기</b>를 누르면 맞은 칸은 그대로 두고 빨간 칸만 다시 배열할 수 있어요.</div>`;
    if(D.exp) msg+=`<div class="expl">${esc(D.exp)}</div>`;
    fb.innerHTML=msg;
  }
}

// U-3: 완료(전체정답 도달) 시 1건 저장. firstPct가 실력 지표. (통일 스키마)
function saveP3Result(){
  try{
    if(typeof DB==='undefined'||!DB){ console.warn('DB 없음 — Phase III 저장 생략'); return; }
    if(!curPid){ console.warn('curPid 없음 — 저장 생략'); return; }
    const nm = studentName || '(이름없음)';
    const num = D.num;
    const pct = firstTotal?Math.round(firstCorrect/firstTotal*100):0;
    const ts = Date.now();
    DB.ref(`structure_trainer/results/${sKey(nm)}/${curPid}_Phase3_${ts}`).set({
      name: nm, passageId: curPid, passageNum: num, passageTitle: D.title,
      phase: 3,
      firstCorrect: firstCorrect, total: firstTotal, firstPct: pct,
      completedAt: ts,
      date: new Date(ts).toISOString()
    });
  }catch(e){ console.warn('Phase III 저장 실패', e); }
}

// 맞은 칸은 잠그고, 틀린 칸의 청크/단어만 뱅크로 회수해 재배열
function reviseWrong(){
  slots.forEach((s,i)=>{
    if(isPlacedCorrect(i)){
      s.locked=true;                       // 맞은 칸 고정
    } else if(s.placed){
      // 틀린 칸 → 뱅크로 회수. 입력단어(word)는 기존 값 보존해 입력칸 복원.
      returnToBank(s.placed);
      s.placed=null;
    }
  });
  graded=false;          // 다시 풀이 모드(잠긴 칸은 그대로 초록)
  render();
  // 단어가 회수돼 입력칸이 생겼으면 포커스+전체선택 → 바로 고치게
  const bi=document.getElementById('blankIn');
  if(bi){ bi.focus(); bi.select(); }
}

function resetAll(){ init(); }

/* ===== 입력 청크 타이핑 ===== */
function bindInput(){
  const el=document.getElementById('blankIn');
  if(!el) return;
  el.addEventListener('input',e=>{
    blankWord=e.target.value;
    // 리렌더 없이 상태만 반영(입력 끊김 방지). 입력칸이 곧 드래그 가능한 청크 역할을 겸함.
    const wrap=el.closest('.ck-input');
    if(wrap) wrap.classList.toggle('has-word', blankWord.trim()!=='');
    renderCtrl();
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault();
      placeInputWord();
    }
  });
}
function findBankKind(k){ return bank.findIndex(b=>b.kind===k); }
// 입력칸의 단어를 첫 빈 슬롯에 배치(엔터 또는 입력칸 드래그/탭 시 공통 사용)
function placeInputWord(targetSlotIdx){
  if(blankWord.trim()==='') return false;
  const i=findBankKind('input'); if(i<0) return false;
  const target = (targetSlotIdx!=null) ? slots[targetSlotIdx] : slots.find(s=>!s.locked && s.placed===null);
  if(!target || target.locked || target.placed!==null) return false;
  bank[i]={kind:'word',text:blankWord.trim()};
  target.placed=bank[i]; bank.splice(i,1); render(); return true;
}

/* ===== 슬롯 클릭 제거 ===== */
function bindSlots(){
  document.querySelectorAll('.slot.filled[data-act="remove"]').forEach(el=>{
    const i=+el.dataset.slot;
    // 클릭 → 뱅크로 회수
    el.addEventListener('click',()=>{
      if(graded) return;
      const s=slots[i];
      if(s.placed){ returnToBank(s.placed); s.placed=null; render(); }
    });
    // 드래그 소스(슬롯)
    el.addEventListener('dragstart',e=>{
      dragData={src:'slot',slotIdx:i};
      el.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', slots[i].placed?.text||'');
    });
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');clearDragOver();dragData=null;});
    // 드롭 타깃(채워진 슬롯) → 삽입+밀어내기
    el.addEventListener('dragover',e=>{ if(slots[i].locked) return; e.preventDefault();
      el.classList.remove('drag-over','insert-before','insert-after');
      if(!dragData) return;
      if(dragData.src==='slot'){
        if(dragData.slotIdx===i){ return; } // 자기 자신엔 표시 안 함
        const from=movablePos(dragData.slotIdx), to=movablePos(i);
        el.classList.add(from>to ? 'insert-before' : 'insert-after');
      } else {
        // 뱅크/입력 청크 → 채워진 슬롯에 삽입(왼쪽에 끼고 기존 오른쪽 밀림)
        el.classList.add('insert-before');
      }
    });
    el.addEventListener('dragleave',()=>{el.classList.remove('drag-over','insert-before','insert-after');});
    el.addEventListener('drop',e=>{ if(slots[i].locked) return; e.preventDefault();
      el.classList.remove('drag-over','insert-before','insert-after'); handleDropOnSlot(i); });
    el.addEventListener('pointerdown',startPointerDrag);
  });
}

// 청크/단어를 뱅크로 되돌리기 (word는 입력칸 복원, 기존 입력값 보존)
function returnToBank(item){
  if(item.kind==='word'){
    blankWord=item.text||'';            // 기존 단어 보존 → 입력칸에 그대로 복원
    if(bank.findIndex(b=>b.kind==='input')<0) bank.push({kind:'input'});
  } else {
    bank.push(item);
  }
}

/* ===== 드래그/탭 ===== */

// 어떤 소스든 슬롯 i에 드롭됐을 때 처리(빈칸=이동/배치, 채워짐=스왑)
function handleDropOnSlot(i){
  if(!dragData) return;
  const target=slots[i]; if(target.locked) return;
  // 소스에서 아이템 확보
  let item=null;
  if(dragData.src==='bank'){ item=bank[dragData.bankIdx]; }
  else if(dragData.src==='input'){ if(blankWord.trim()==='')return; item={kind:'word',text:blankWord.trim()}; }
  else if(dragData.src==='slot'){ item=slots[dragData.slotIdx].placed; }
  if(!item) return;

  if(dragData.src==='slot'){
    const from=slots[dragData.slotIdx];
    if(from===target) return;
    insertSlot(dragData.slotIdx, i);     // 삽입+밀어내기
  } else if(dragData.src==='bank'){
    if(target.placed){ insertExternal(item, i); bank.splice(dragData.bankIdx,1); }
    else { target.placed=item; bank.splice(dragData.bankIdx,1); }
  } else if(dragData.src==='input'){
    const ii=bank.findIndex(b=>b.kind==='input');
    if(ii<0) return;
    const wordItem={kind:'word',text:item.text};
    if(target.placed){ bank[ii]=wordItem; insertExternal(wordItem, i); bank.splice(bank.indexOf(wordItem),1); }
    else { bank[ii]=wordItem; target.placed=wordItem; bank.splice(ii,1); }
  }
  render();
}

// 외부(뱅크/입력) 청크를 채워진 슬롯 toIdx에 삽입. toIdx부터 뒤로 밀고,
// 빈 슬롯이 있으면 그게 흡수, 없으면 맨 끝 청크가 뱅크로 회수.
function insertExternal(item, toIdx){
  const movable = slots.map((s,i)=>i).filter(i=>!slots[i].locked);
  const seq = movable.map(i=>slots[i].placed);  // null 포함
  const tp = movable.indexOf(toIdx);
  if(tp<0) return;
  seq.splice(tp,0,item);          // toIdx 자리에 삽입(뒤로 밀림)
  // 슬롯 수 유지: 뒤쪽에서 첫 빈칸(null)을 제거해 흡수. 없으면 맨 끝 제거→뱅크.
  let removeAt=-1;
  for(let k=seq.length-1;k>tp;k--){ if(seq[k]===null){ removeAt=k; break; } }
  if(removeAt>=0){ seq.splice(removeAt,1); }
  else { const ov=seq.pop(); if(ov) returnToBank(ov); }
  movable.forEach((idx,k)=> slots[idx].placed = (k<seq.length? seq[k] : null));
}

// 슬롯 인덱스 → 이동가능(잠기지 않은) 슬롯들 중 몇 번째인지
function movablePos(idx){
  const movable = slots.map((s,i)=>i).filter(i=>!slots[i].locked);
  return movable.indexOf(idx);
}

// 삽입+밀어내기: fromIdx의 청크를 toIdx 자리에 끼워넣고 사이 청크들을 한 칸씩 민다.
// 잠긴 칸은 위치 고정(이동 대상에서 제외). 채워진 청크들의 "순서"만 재배열.
function insertSlot(fromIdx, toIdx){
  // 이동 가능한(잠기지 않은) 슬롯 인덱스 목록
  const movable = slots.map((s,idx)=>idx).filter(idx=>!slots[idx].locked);
  // 현재 movable 슬롯들의 placed 값(빈칸은 null) 순서
  const seq = movable.map(idx=>slots[idx].placed);
  // from/to를 movable 기준 위치로 변환
  const fp = movable.indexOf(fromIdx);
  const tp = movable.indexOf(toIdx);
  if(fp<0||tp<0) return;
  // fp 항목을 빼서 tp 위치에 삽입
  const [moved]=seq.splice(fp,1);
  seq.splice(tp,0,moved);
  // 재배치: movable 슬롯들에 새 순서대로 다시 채움
  movable.forEach((idx,k)=> slots[idx].placed = seq[k]);
}

// 뱅크 영역에 드롭 → 슬롯의 청크 회수
function handleDropOnBank(){
  if(!dragData || dragData.src!=='slot') return;
  const from=slots[dragData.slotIdx];
  if(from.placed && !from.locked){ returnToBank(from.placed); from.placed=null; render(); }
}

function bindBank(){
  const bankZone=document.getElementById('bank');
  bankZone.addEventListener('dragover',e=>{ if(dragData&&dragData.src==='slot'){e.preventDefault();bankZone.classList.add('drag-over');} });
  bankZone.addEventListener('dragleave',e=>{ if(e.target===bankZone) bankZone.classList.remove('drag-over'); });
  bankZone.addEventListener('drop',e=>{ e.preventDefault(); bankZone.classList.remove('drag-over'); handleDropOnBank(); });

  document.querySelectorAll('#bank .ck[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragData={src:'bank',bankIdx:+el.dataset.bank};
      el.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', bank[+el.dataset.bank].text||'');
    });
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');clearDragOver();dragData=null;});
    el.addEventListener('click',()=>{ // 모바일 탭 → 첫 빈 슬롯
      if(graded) return;
      const idx=+el.dataset.bank; const target=slots.find(s=>!s.locked && s.placed===null);
      if(target){ target.placed=bank[idx]; bank.splice(idx,1); render(); }
    });
    el.addEventListener('pointerdown',startPointerDrag);
  });
  // 입력칸: 단어가 입력돼 있으면 탭/드래그 손잡이(✎)로 슬롯 배치
  const inWrap=document.querySelector('#bank .ck-input');
  if(inWrap){
    inWrap.addEventListener('click',e=>{
      if(e.target.tagName==='INPUT') return;
      if(graded) return;
      placeInputWord();
    });
    inWrap.setAttribute('draggable','true');
    inWrap.addEventListener('dragstart',e=>{
      if(blankWord.trim()===''){ e.preventDefault(); return; }
      dragData={src:'input'};
      e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',blankWord.trim());
    });
    inWrap.addEventListener('dragend',()=>{clearDragOver();dragData=null;});
  }
  // 빈 슬롯 드롭 타깃
  document.querySelectorAll('.slot.empty').forEach(slotEl=>{
    slotEl.addEventListener('dragover',e=>{e.preventDefault();slotEl.classList.add('drag-over');});
    slotEl.addEventListener('dragleave',()=>slotEl.classList.remove('drag-over'));
    slotEl.addEventListener('drop',e=>{e.preventDefault();slotEl.classList.remove('drag-over');
      handleDropOnSlot(+slotEl.dataset.slot);
    });
  });
}
function placeInSlot(slotIdx,bankIdx){
  const s=slots[slotIdx]; if(s.locked||s.placed!==null) return;
  s.placed=bank[bankIdx]; bank.splice(bankIdx,1); render();
}
function clearDragOver(){document.querySelectorAll('.drag-over,.insert-before,.insert-after').forEach(e=>e.classList.remove('drag-over','insert-before','insert-after'));}
function startPointerDrag(e){
  if(e.pointerType==='mouse') return;
  if(graded && !e.currentTarget.classList.contains('slot')) return;
  if(graded) return;
  const el=e.currentTarget;
  // 소스 판별: 뱅크 청크 / 슬롯
  if(el.classList.contains('slot')){
    if(el.classList.contains('locked')) return;
    dragData={src:'slot',slotIdx:+el.dataset.slot};
  } else {
    dragData={src:'bank',bankIdx:+el.dataset.bank};
  }
  const text = el.textContent.trim() || (bank[dragData.bankIdx]?.text)||'';
  e.preventDefault();
  ghost=document.createElement('div');ghost.id='drag-ghost';ghost.textContent=text;document.body.appendChild(ghost);moveGhost(e);
  el.classList.add('dragging'); let cur=null;
  function mv(ev){ moveGhost(ev); const t=document.elementFromPoint(ev.clientX,ev.clientY);
    const se=t&&t.closest?t.closest('.slot'):null;
    const drop = (se && !se.classList.contains('locked')) ? se : null;
    if(cur&&cur!==drop) cur.classList.remove('drag-over','insert-before','insert-after');
    if(drop){
      drop.classList.remove('drag-over','insert-before','insert-after');
      const dropIdx=+drop.dataset.slot;
      if(drop.classList.contains('filled') && !(dragData.src==='slot' && dragData.slotIdx===dropIdx)){
        // 채워진 슬롯에 드롭 → 삽입. 밀림 방향 예고.
        if(dragData.src==='slot'){
          const from=movablePos(dragData.slotIdx), to=movablePos(dropIdx);
          drop.classList.add(from>to ? 'insert-before' : 'insert-after');
        } else {
          drop.classList.add('insert-before'); // 뱅크/입력 → 이 칸 자리에 끼고 기존은 오른쪽 밀림
        }
      } else {
        drop.classList.add('drag-over');
      }
      cur=drop;
    } else cur=null;
  }
  function up(ev){ document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
    if(ghost){ghost.remove();ghost=null;} el.classList.remove('dragging');
    const t=document.elementFromPoint(ev.clientX,ev.clientY);
    const se=t&&t.closest?t.closest('.slot'):null;
    if(se && !se.classList.contains('locked')) handleDropOnSlot(+se.dataset.slot);
    else { // 뱅크 영역에 드롭하면 회수(슬롯 소스만)
      const bz=t&&t.closest?t.closest('#bank'):null;
      if(bz) handleDropOnBank();
    }
    if(cur)cur.classList.remove('drag-over','insert-before','insert-after'); dragData=null;
  }
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
}
function moveGhost(e){if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function has(pid){ const k=DATA.map[pid]; return !!(k && DATA.passages[k]); }
  function open(pid){ const k=DATA.map[pid]; if(!k||!DATA.passages[k])return false; curKey=k; curPid=pid; studentName=(typeof S!=='undefined'&&S.name)?S.name:''; init(); return true; }
  function back(){ if(typeof onBackToPhase==='function') onBackToPhase(); }
  return { has:has, open:open, checkAnswer:checkAnswer, resetAll:resetAll, reviseWrong:reviseWrong, back:back };
})();

/* Phase III 화면 연동 */
function onBackToPhase(){ S.screen='phase'; R(); }
function vPhase3(){ setTimeout(()=>{ P3.open(S.pid); },0); return '<div class="card muted">서술형 문제를 불러오는 중...</div>'; }

</script>
