<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f5f7fa;color:#1e293b;-webkit-tap-highlight-color:transparent}
.ctn{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px}
.brand{font-size:23px;font-weight:900;color:#1B3A5C;text-align:center;user-select:none}
.brand-sub{font-size:11px;color:#888;text-align:center;margin-top:3px;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;font-size:16px;border:2px solid #ddd;border-radius:10px;outline:none;text-align:center}
input:focus{border-color:#1B3A5C}
.btn{display:block;width:100%;padding:13px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s;margin-top:8px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:default}
.bn{background:#1B3A5C;color:#fff}.bg{background:#E8A010;color:#fff}.bo{background:#fff;color:#1B3A5C;border:2px solid #1B3A5C}
.bGray{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1}.bGreen{background:#16a34a;color:#fff}
.set-item{border:2px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.set-item:hover{border-color:#1B3A5C;background:#f8fafc}
.set-title{font-size:15px;font-weight:800;color:#1B3A5C}
.set-meta{font-size:12px;color:#64748b;margin-top:4px;line-height:1.4}
.set-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;margin-left:6px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.topbar .q-num{font-size:13px;font-weight:800;color:#1B3A5C}.topbar .q-mode{font-size:12px;color:#fff;font-weight:700;background:#E8A010;padding:3px 10px;border-radius:6px}
.pb{background:#e2e8f0;border-radius:99px;height:6px;overflow:hidden;margin-bottom:16px}.pf{height:100%;background:linear-gradient(90deg,#1B3A5C,#E8A010);border-radius:99px;transition:width .4s}
.phase-info{font-size:12px;color:#475569;background:#f1f5f9;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.5}.phase-info b{color:#1B3A5C}
.hint-method{font-size:11px;color:#94a3b8;text-align:center;margin-bottom:10px}
.zone-lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.answer-zone{min-height:64px;border:2px dashed #1B3A5C;border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;margin-bottom:14px;background:#f8fafc;transition:border-color .2s,background .2s}
.answer-zone.empty{border-color:#cbd5e1}.answer-zone.drag-over{border-color:#1B3A5C;background:#eff6ff}
.zone-ph{font-size:12px;color:#cbd5e1;font-style:italic;padding:8px;width:100%;text-align:center}
.bank-zone{min-height:64px;background:#f1f5f9;border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;margin-bottom:14px;transition:background .2s}.bank-zone.drag-over{background:#f0f4ff}
.ck{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:2px solid;transition:transform .12s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none;line-height:1.3;touch-action:none}
.ck:active{transform:scale(.93)}.ck[draggable]{cursor:grab}.ck.dragging{opacity:.35;transform:scale(.95)}
.ck-bank{background:#fff;border-color:#cbd5e1;color:#1e293b}.ck-bank:hover{border-color:#1B3A5C;background:#f0f4ff}
.ck-ans{background:#1B3A5C;border-color:#1B3A5C;color:#fff}.ck-ans:hover{background:#152d4a}
.ck-ok{background:#f0fdf4!important;border-color:#16a34a!important;color:#15803d!important}
.ck-no{background:#fff5f5!important;border-color:#dc2626!important;color:#dc2626!important}
.drop-indicator{width:3px;min-height:36px;border-radius:3px;background:#1B3A5C;flex-shrink:0;align-self:center;animation:blink .6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.3}to{opacity:1}}
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;background:#1B3A5C;color:#fff;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:.9;white-space:nowrap;transform:translate(-50%,-50%)}
.feedback{border-radius:10px;padding:13px 15px;margin-bottom:12px;font-size:13px;line-height:1.6}
.fb-ok{background:#f0fdf4;border:1px solid #86efac;color:#15803d}.fb-no{background:#fff5f5;border:1px solid #fca5a5;color:#b91c1c}
.fb-hint{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}.fb-trap{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af}
.expl{background:#f8fafc;border-left:3px solid #1B3A5C;border-radius:0 8px 8px 0;padding:11px 14px;margin-top:10px;font-size:12.5px;line-height:1.6;color:#334155}.expl b{color:#1B3A5C}
.gp{display:inline-block;font-size:11px;font-weight:700;background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:6px;margin:2px 3px 2px 0}
.center{text-align:center}.big-score{font-size:42px;font-weight:900;color:#E8A010;text-align:center;margin:10px 0}
.muted{color:#64748b;font-size:12px}h2.sec{font-size:16px;font-weight:800;color:#1B3A5C;margin-bottom:10px}
.attempt-dots{text-align:center;margin-bottom:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cbd5e1;margin:0 3px}.dot.used{background:#E8A010}
.back-link{font-size:12px;color:#64748b;cursor:pointer;display:inline-block;margin-bottom:8px}.back-link:hover{color:#1B3A5C}
.admin-link{font-size:12px;color:#94a3b8;background:none;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;padding:6px 16px;font-weight:600;display:block;margin:8px auto 0}
.user-tag{font-size:11px;color:#94a3b8;text-align:right;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#f1f5f9;color:#475569;padding:8px;text-align:left;font-weight:700;border-bottom:2px solid #e2e8f0}
.tbl td{padding:8px;border-bottom:1px solid #f1f5f9}
.tbl tr:hover{background:#f8fafc}
.stu-item{border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.stu-item:hover{border-color:#1B3A5C;background:#f8fafc}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
</style>

function login(){const e=$('nameInput');const nm=(e?e.value:'').trim();if(!nm){if(e)e.focus();return;}S.name=nm;S.screen='home';R();}
function logout(){
  let fromPortal=false;
  try{ fromPortal=!!sessionStorage.getItem('sf_student'); }catch(e){}
  if(fromPortal){
    try{
      if(window.parent && window.parent!==window){
        window.parent.postMessage({type:'SF_CLOSE_TOOL'},'*');
        return;
      }
    }catch(e){}
    location.href='sf-portal.html'; return;
  }
  S=Object.assign(S,{screen:'login',name:'',pid:null,phase:null});R();
}

  m.innerHTML=`<div class="modal-card">

function startPhase(ph){S.phase=ph;S.qi=0;S.results=[];S.resumeData=null;checkResume(ph);}
function checkResume(ph){
  // 미완료 진행 기록이 있으면 이어하기 물어보기
  const p=curP();
  if(!DB){S.phase=ph;S.qi=0;S.results=[];S.screen='quiz';loadQ();R();return;}
  DB.ref(`structure_trainer/progress/${sKey(S.name)}/${p.id}_Phase${ph}`).once('value',snap=>{
    const v=snap.val();
    if(v&&v.results&&v.nextQi>0&&v.nextQi<p.questions.length){
      // 이어하기 선택지 표시
      S.phase=ph;S.resumeData=v;S.screen='resume';R();
    }else{
      S.phase=ph;S.qi=0;S.results=[];S.screen='quiz';loadQ();R();
    }
  },()=>{S.phase=ph;S.qi=0;S.results=[];S.screen='quiz';loadQ();R();});
}
function vResume(){
  const p=curP(),v=S.resumeData;
  const doneCnt=v.nextQi;
  return `<div class="card"><span class="back-link" onclick="backToPhase()">← 단계 선택</span>
    <h2 class="sec">이어서 하시겠어요?</h2>
    <div class="phase-info"><b>${esc(p.title)} · Phase ${S.phase}</b><br>
    지난번에 <b>${p.questions.length}문장 중 ${doneCnt}문장</b>까지 풀었어요.</div>
    <button class="btn bn" onclick="resumeStart()">이어서 하기 (${doneCnt+1}번 문장부터)</button>
    <button class="btn bo" onclick="freshStart()">처음부터 다시</button></div>`;
}
function resumeStart(){const v=S.resumeData;S.results=v.results||[];S.qi=v.nextQi;S.screen='quiz';loadQ();R();}
function freshStart(){S.qi=0;S.results=[];S.resumeData=null;S.screen='quiz';loadQ();R();}
function curP(){return DATA.passages.find(x=>x.id===S.pid);}
function curQ(){return curP().questions[S.qi];}
function curPhaseData(){const q=curQ();return S.phase==='I'?q.phaseI:q.phaseII;}
function loadQ(){const pd=curPhaseData();S.answerOrder=pd.chunks.slice();S.bank=shuffle(pd.chunks.map((c,i)=>({c,i})));S.placed=[];S.attempt=0;S.done=false;}

function ckHtml(it,zone,pos){
  const drag=S.done?'':'draggable="true"';let cls='ck ';
  if(zone==='ans')cls+=S.done?(it.i===pos?'ck-ok':'ck-no'):'ck-ans';else cls+='ck-bank';
  const clk=S.done?'':`onclick="ckTap('${zone}',${pos})"`;
  return `<span class="${cls}" data-zone="${zone}" data-pos="${pos}" ${drag} ${clk}>${esc(it.c)}</span>`;
}
function vQuiz(){
  const p=curP(),pd=curPhaseData(),total=p.questions.length,prog=Math.round((S.qi/total)*100);
  let h=`<div class="card"><span class="back-link" onclick="backToPhase()">← 단계 선택</span><div class="topbar"><span class="q-num">${esc(p.title)} · ${S.qi+1}/${total}문장</span><span class="q-mode">Phase ${S.phase}</span></div><div class="pb"><div class="pf" style="width:${prog}%"></div></div>`;
  h+=`<div class="phase-info">${S.phase==='I'?'<b>구조 복원:</b> 큰 덩어리를 자연스러운 순서로 배열하세요.':'<b>세분화 배열:</b> 잘게 나뉜 청크를 정확한 순서로 배열하세요.'} ${esc(pd.goal||'')}</div>`;
  h+=`<div class="hint-method">청크를 <b>탭</b>하거나 <b>드래그</b>해서 옮길 수 있어요</div>`;
  h+=`<div class="zone-lbl">내가 만든 순서</div><div class="answer-zone${S.placed.length?'':' empty'}" id="ansZone" data-zone="ans">`;
  if(!S.placed.length)h+=`<div class="zone-ph">아래 청크를 눌러 순서대로 배열하세요</div>`;
  else S.placed.forEach((it,idx)=>{h+=ckHtml(it,'ans',idx);});
  h+=`</div>`;
  if(!S.done){
    h+=`<div class="zone-lbl">청크 보기</div><div class="bank-zone" id="bankZone" data-zone="bank">`;
    if(!S.bank.length)h+=`<div class="zone-ph">모두 배열했습니다</div>`;
    else S.bank.forEach((it,bi)=>{h+=ckHtml(it,'bank',bi);});
    h+=`</div><div class="attempt-dots">`;
    for(let i=0;i<2;i++)h+=`<span class="dot${i<S.attempt?' used':''}"></span>`;
    h+=` <span class="muted">시도 ${S.attempt}/2</span></div>`;
  }
  h+=`<div id="fbArea"></div>`;
  if(!S.done)h+=`<button class="btn bn" id="checkBtn" onclick="checkAnswer()" ${S.placed.length===S.answerOrder.length?'':'disabled'}>채점하기</button><button class="btn bGray" onclick="resetPlaced()">다시 배열</button>`;
  else{const last=S.qi>=p.questions.length-1;h+=`<button class="btn bGreen" onclick="nextQ()">${last?'결과 보기':'다음 문장 →'}</button>`;}
  return h+`</div>`;
}
function ckTap(zone,pos){if(S.done)return;if(zone==='bank'){const it=S.bank[pos];S.bank.splice(pos,1);S.placed.push(it);}else{const it=S.placed[pos];S.placed.splice(pos,1);S.bank.push(it);}R();}
function resetPlaced(){const pd=curPhaseData();S.bank=shuffle(pd.chunks.map((c,i)=>({c,i})));S.placed=[];R();}
function backToPhase(){S.screen='phase';R();}
function moveChunk(srcZone,srcPos,dstZone,dstPos){let it;if(srcZone==='bank'){it=S.bank[srcPos];S.bank.splice(srcPos,1);}else{it=S.placed[srcPos];S.placed.splice(srcPos,1);}if(srcZone===dstZone&&srcPos<dstPos)dstPos--;if(dstZone==='bank'){if(dstPos<0||dstPos>S.bank.length)dstPos=S.bank.length;S.bank.splice(dstPos,0,it);}else{if(dstPos<0||dstPos>S.placed.length)dstPos=S.placed.length;S.placed.splice(dstPos,0,it);}R();}

function bindDnd(){
  if(S.done)return;
  document.querySelectorAll('.ck[draggable]').forEach(el=>{el.addEventListener('dragstart',onDS);el.addEventListener('dragend',onDE);el.addEventListener('dragover',onCDO);el.addEventListener('drop',onCD);el.addEventListener('touchstart',onTS,{passive:false});});
  const az=$('ansZone'),bz=$('bankZone');
  if(az){az.addEventListener('dragover',e=>{e.preventDefault();az.classList.add('drag-over');});az.addEventListener('dragleave',e=>{if(!az.contains(e.relatedTarget))az.classList.remove('drag-over');});az.addEventListener('drop',onZD);}
  if(bz){bz.addEventListener('dragover',e=>{e.preventDefault();bz.classList.add('drag-over');});bz.addEventListener('dragleave',e=>{if(!bz.contains(e.relatedTarget))bz.classList.remove('drag-over');});bz.addEventListener('drop',onBD);}
}
function onDS(e){const el=e.currentTarget;D.srcZone=el.dataset.zone;D.srcPos=+el.dataset.pos;D.active=true;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x');setTimeout(()=>el.classList.add('dragging'),0);}
function onDE(){D.active=false;document.querySelectorAll('.ck.dragging').forEach(el=>el.classList.remove('dragging'));document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));}
function onCDO(e){e.preventDefault();e.stopPropagation();const t=e.currentTarget;document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());const rect=t.getBoundingClientRect();const ind=document.createElement('div');ind.className='drop-indicator';if(e.clientX<rect.left+rect.width/2)t.parentNode.insertBefore(ind,t);else t.parentNode.insertBefore(ind,t.nextSibling);}
function onCD(e){e.preventDefault();e.stopPropagation();if(!D.active)return;const t=e.currentTarget;const dstZone=t.dataset.zone;let dstPos=+t.dataset.pos;const rect=t.getBoundingClientRect();if(e.clientX>=rect.left+rect.width/2)dstPos++;moveChunk(D.srcZone,D.srcPos,dstZone,dstPos);}
function onZD(e){e.preventDefault();if(!D.active)return;if(e.target.id==='ansZone'||e.target.classList.contains('zone-ph'))moveChunk(D.srcZone,D.srcPos,'ans',S.placed.length);}
function onBD(e){e.preventDefault();if(!D.active)return;if(e.target.id==='bankZone'||e.target.classList.contains('zone-ph'))moveChunk(D.srcZone,D.srcPos,'bank',S.bank.length);}
function onTS(e){const el=e.currentTarget;T.el=el;T.srcZone=el.dataset.zone;T.srcPos=+el.dataset.pos;T.startX=e.touches[0].clientX;T.startY=e.touches[0].clientY;T.moved=false;T.active=false;document.addEventListener('touchmove',onTM,{passive:false});document.addEventListener('touchend',onTE,{passive:false});}
function onTM(e){const dx=e.touches[0].clientX-T.startX,dy=e.touches[0].clientY-T.startY;if(!T.active&&Math.hypot(dx,dy)>8){T.active=true;T.moved=true;T.el.classList.add('dragging');const g=document.createElement('div');g.id='drag-ghost';g.textContent=T.el.textContent.trim();document.body.appendChild(g);T.ghost=g;}if(T.active){e.preventDefault();const x=e.touches[0].clientX,y=e.touches[0].clientY;if(T.ghost){T.ghost.style.left=x+'px';T.ghost.style.top=y+'px';}document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());const tgt=document.elementFromPoint(x,y);const ck=tgt&&tgt.closest&&tgt.closest('.ck');if(ck&&ck!==T.el&&ck.dataset.zone){const rect=ck.getBoundingClientRect();const ind=document.createElement('div');ind.className='drop-indicator';if(x<rect.left+rect.width/2)ck.parentNode.insertBefore(ind,ck);else ck.parentNode.insertBefore(ind,ck.nextSibling);}}}
function onTE(e){document.removeEventListener('touchmove',onTM);document.removeEventListener('touchend',onTE);if(T.active){const t=e.changedTouches[0],x=t.clientX,y=t.clientY;const tgt=document.elementFromPoint(x,y);let dstZone=null,dstPos=-1;const ck=tgt&&tgt.closest&&tgt.closest('.ck');const zone=tgt&&tgt.closest&&tgt.closest('[data-zone]');if(ck&&ck.dataset.zone){dstZone=ck.dataset.zone;dstPos=+ck.dataset.pos;const rect=ck.getBoundingClientRect();if(x>=rect.left+rect.width/2)dstPos++;}else if(zone&&zone.dataset.zone){dstZone=zone.dataset.zone;dstPos=(dstZone==='ans')?S.placed.length:S.bank.length;}if(T.ghost)T.ghost.remove();if(T.el)T.el.classList.remove('dragging');document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());if(dstZone)moveChunk(T.srcZone,T.srcPos,dstZone,dstPos);else R();}T.active=false;T.el=null;T.ghost=null;T.moved=false;}

function checkAnswer(){if(S.placed.length!==S.answerOrder.length)return;S.attempt++;const correct=S.placed.every((it,idx)=>it.i===idx);const pd=curPhaseData();if(correct){S.done=true;S.results.push({qi:S.qi,attempts:S.attempt,correct:true});saveProgress();R();showFeedback('ok');return;}const trap=detectTrap(pd);if(S.attempt>=2){S.done=true;S.results.push({qi:S.qi,attempts:S.attempt,correct:false});saveProgress();R();showFeedback('reveal',trap);}else{R();showFeedback(trap?'trap':'hint',trap);}}
function saveProgress(){
  if(!DB)return;const p=curP();
  try{DB.ref(`structure_trainer/progress/${sKey(S.name)}/${p.id}_Phase${S.phase}`).set({
    name:S.name,passageId:p.id,passageTitle:p.title,phase:S.phase,
    nextQi:S.qi+1,total:p.questions.length,
    results:S.results.map(r=>({qi:r.qi,attempts:r.attempts,correct:r.correct})),
    date:new Date().toISOString()
  });}catch(e){console.warn('progress save fail',e);}
}
function detectTrap(pd){if(!pd.attachmentTraps||!pd.attachmentTraps.length)return null;for(const tr of pd.attachmentTraps){const ci=S.placed.findIndex(it=>it.c===tr.chunk);const wi=S.placed.findIndex(it=>it.c.indexOf(tr.wrongAfter)>=0||tr.wrongAfter.indexOf(it.c)>=0);if(ci>=0&&wi>=0&&ci===wi+1)return tr;}return null;}
function showFeedback(type,trap){const fb=$('fbArea');if(!fb)return;const q=curQ();let h='';if(type==='ok'){h=`<div class="feedback fb-ok">정확합니다! 구조를 제대로 복원했어요.${S.attempt>1?' ('+S.attempt+'번째 시도)':''}</div>`+explHtml(q);}else if(type==='trap'){h=`<div class="feedback fb-trap"><b>수식어 위치를 다시 보세요.</b><br>${esc(trap.hint)}</div><div class="feedback fb-hint">다시 한 번 배열해 보세요. (시도 ${S.attempt}/2)</div>`;}else if(type==='hint'){h=`<div class="feedback fb-hint"><b>아직 순서가 맞지 않아요.</b><br>${S.phase==='I'?'먼저 핵심 뼈대(주어·동사)를 앞에 놓고, 수식어 덩어리가 어디 붙는지 생각해 보세요.':'각 청크의 역할(주어·동사·목적어·수식어)을 떠올리며 순서를 다시 잡아 보세요.'} (시도 ${S.attempt}/2)</div>`;}else if(type==='reveal'){if(trap)h=`<div class="feedback fb-trap"><b>수식어 위치 힌트:</b><br>${esc(trap.hint)}</div>`;h+=`<div class="feedback fb-no"><b>정답을 확인하세요.</b><br>아래가 올바른 순서입니다.</div>`+correctOrderHtml()+explHtml(q);}fb.innerHTML=h;}
function correctOrderHtml(){const pd=curPhaseData();let h=`<div class="zone-lbl" style="margin-top:8px">정답 순서</div><div class="answer-zone">`;pd.chunks.forEach(c=>{h+=`<span class="ck ck-ok">${esc(c)}</span>`;});return h+`</div>`;}
function explHtml(q){const pd=curPhaseData();let h=`<div class="expl"><b>구조 해설:</b> ${esc(q.explanation)}`;if(S.phase==='II'&&pd.grammarPoints&&pd.grammarPoints.length){h+=`<div style="margin-top:8px">`;pd.grammarPoints.forEach(g=>{h+=`<span class="gp">${esc(g.type)}</span>`;});h+=`</div><div style="margin-top:6px;font-size:12px">`;pd.grammarPoints.forEach(g=>{h+=`· ${esc(g.note)}<br>`;});h+=`</div>`;}return h+`</div>`;}
function nextQ(){const p=curP();if(S.qi>=p.questions.length-1){saveResult();S.screen='setdone';R();return;}S.qi++;loadQ();R();}

// ===== Firebase 결과 저장 (structure_trainer/results/{name}/{pid}_Phase{ph}_{ts}) =====
function saveResult(){
  if(!DB){console.warn('DB 없음 — 저장 생략');return;}
  const p=curP(),tot=S.results.length,ok=S.results.filter(r=>r.correct).length;
  const firstTry=S.results.filter(r=>r.correct&&r.attempts===1).length,pct=Math.round(ok/tot*100);
  try{
    DB.ref(`structure_trainer/results/${sKey(S.name)}/${p.id}_Phase${S.phase}_${Date.now()}`).set({
      name:S.name,passageId:p.id,passageTitle:p.title,phase:S.phase,
      total:tot,correct:ok,firstTry:firstTry,pct:pct,
      detail:S.results.map(r=>({qi:r.qi,attempts:r.attempts,correct:r.correct})),
      date:new Date().toISOString()
    });
    // 완료했으니 진행 임시저장 제거
    DB.ref(`structure_trainer/progress/${sKey(S.name)}/${p.id}_Phase${S.phase}`).remove();
  }catch(e){console.warn('save fail',e);}
}

function vSetDone(){
  const p=curP(),tot=S.results.length,ok=S.results.filter(r=>r.correct).length;
  const firstTry=S.results.filter(r=>r.correct&&r.attempts===1).length,pct=Math.round(ok/tot*100);
  let h=`<div class="card center"><h2 class="sec">Phase ${S.phase} 완료!</h2><div class="muted">${esc(p.title)} · ${esc(S.name)}님</div><div class="big-score">${pct}%</div><div class="muted">${tot}문장 중 ${ok}문장 정답 · 첫 시도 정답 ${firstTry}문장</div>${DB?'<div class="muted" style="margin-top:6px;color:#16a34a">✓ 기록이 저장되었습니다</div>':'<div class="muted" style="margin-top:6px;color:#dc2626">기록 저장 안 됨(오프라인)</div>'}</div><div class="card">`;
  if(S.phase==='I')h+=`<div class="phase-info"><b>다음 단계 추천:</b> 구조가 보였다면 Phase II로 더 세밀하게 나누고 어법까지 확인해 보세요.</div><button class="btn bg" onclick="startPhase('II')">Phase II 도전 (세분화 + 어법)</button>`;
  else h+=`<div class="phase-info">수고했습니다! 다른 지문도 훈련해 보세요.</div>`;

function vAdmin(){
  const el=$('app');
  el.innerHTML=`<div class="card"><span class="back-link" onclick="logout()">← 로그아웃</span><h2 class="sec">🔐 관리자 — 학생 훈련 현황</h2><div class="muted" id="adminStatus">불러오는 중...</div></div><div id="adminBody"></div>`;
  if(!DB){$('adminStatus').textContent='Firebase 연결 안 됨 — 기록을 불러올 수 없습니다.';return;}
  Promise.all([
    DB.ref('structure_trainer/results').once('value'),
    DB.ref('structure_trainer/progress').once('value')
  ]).then(([rs,ps])=>{
    const data=rs.val()||{};const prog=ps.val()||{};
    window.__progAll=prog;
    const names=[...new Set([...Object.keys(data),...Object.keys(prog)])];
    if(!names.length){$('adminStatus').textContent='아직 저장된 훈련 기록이 없습니다.';return;}
    $('adminStatus').textContent=`총 ${names.length}명의 학생 기록`;
    let h='<div class="card">';
    // 학생별 요약
    const stuSummary=names.map(nk=>{
      const recs=data[nk]?Object.values(data[nk]):[];
      const progRecs=prog[nk]?Object.values(prog[nk]):[];
      const nm=(recs[0]||progRecs[0]||{}).name||nk;
      const cnt=recs.length;
      const inProg=progRecs.length;
      const allDates=[...recs.map(r=>r.date),...progRecs.map(r=>r.date)];
      const last=allDates.reduce((mx,d)=>d>mx?d:mx,'');
      const avgPct=cnt?Math.round(recs.reduce((s,r)=>s+(r.pct||0),0)/cnt):0;
      return {nk,nm,cnt,inProg,last,avgPct};
    }).sort((a,b)=>b.last.localeCompare(a.last));
    stuSummary.forEach(s=>{
      const col=s.avgPct>=80?'#16a34a':s.avgPct>=60?'#E8A010':'#dc2626';
      const dt=s.last?new Date(s.last).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'-';
      const progBadge=s.inProg?` · <span style="color:#E8A010">진행중 ${s.inProg}</span>`:'';
      h+=`<div class="stu-item" onclick="adminStudent('${esc(s.nk)}')">
        <div><div style="font-weight:800;color:#1B3A5C">${esc(s.nm)}</div><div class="muted">완료 ${s.cnt}회${progBadge} · 최근 ${dt}</div></div>
        <div class="pill" style="background:${col}22;color:${col}">${s.cnt?('평균 '+s.avgPct+'%'):'미완료'}</div></div>`;
    });
    h+='</div>';
    $('adminBody').innerHTML=h;
  },err=>{$('adminStatus').textContent='기록 로드 실패: '+err.message;});
}
function adminStudent(nk){
  const el=$('app');
  el.innerHTML=`<div class="card"><span class="back-link" onclick="S.screen='admin';R()">← 학생 목록</span><h2 class="sec" id="stuName">학생 상세</h2></div><div id="stuBody"><div class="card muted">불러오는 중...</div></div>`;

  ]).then(([rs,ps])=>{

    const recs=Object.values(data).map(r=>({...r,_done:true}));
    const progs=Object.values(prog).map(r=>({...r,_done:false,
      correct:(r.results||[]).filter(x=>x.correct).length,
      firstTry:(r.results||[]).filter(x=>x.correct&&x.attempts===1).length,

    }));
    const all=[...recs,...progs].sort((a,b)=>b.date.localeCompare(a.date));

    $('stuName').textContent=nm+' — 훈련 기록';
    window.__stuRecs=all;
    let h='<div class="card"><table class="tbl"><tr><th>지문</th><th>단계</th><th>정답</th><th>진행</th><th>날짜</th></tr>';
    all.forEach((r,i)=>{
      const col=r.pct>=80?'#16a34a':r.pct>=60?'#E8A010':'#dc2626';
      const dt=new Date(r.date).toLocaleDateString('ko-KR',{month:'short',day:'numeric'})+' '+new Date(r.date).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const doneTxt=r._done?'<span style="color:#16a34a;font-weight:700">완료</span>':`<span style="color:#E8A010;font-weight:700">진행중 ${r.nextQi||r.correct}/${r.total}</span>`;
      const cntDisp=r._done?`${r.correct}/${r.total} (${r.pct}%)`:`${r.correct}/${(r.results||[]).length||0}`;
      h+=`<tr style="cursor:pointer" onclick="adminDetail(${i})"><td>${esc(r.passageTitle)}</td><td>Phase ${r.phase}</td><td style="color:${col};font-weight:700">${cntDisp}</td><td>${doneTxt}</td><td class="muted">${dt}</td></tr>`;
    });
    h+='</table><div class="muted" style="margin-top:8px">행을 누르면 문장별 상세를 볼 수 있어요</div></div>';
    $('stuBody').innerHTML=h;
  });
}
function adminDetail(i){
  const r=(window.__stuRecs||[])[i];if(!r)return;
  const p=DATA.passages.find(x=>x.id===r.passageId);
  const det=r.detail||r.results||[];
  let h=`<div class="card"><span class="back-link" onclick="adminStudent('${sKey(r.name)}')">← 기록 목록</span>
    <h2 class="sec">${esc(r.passageTitle)} · Phase ${r.phase}</h2>
    <div class="muted" style="margin-bottom:10px">${r._done?'완료':'진행중'} · ${esc(r.name)}</div>
    <table class="tbl"><tr><th>문장</th><th>결과</th><th>시도</th></tr>`;
  const total=r.total||(p?p.questions.length:det.length);
  for(let qi=0;qi<total;qi++){
    const d=det.find(x=>x.qi===qi);
    let res,sty;
    if(!d){res='미완료';sty='color:#94a3b8';}
    else if(d.correct){res='정답';sty='color:#16a34a;font-weight:700';}
    else{res='오답';sty='color:#dc2626;font-weight:700';}
    const att=d?(d.attempts+'회'):'-';
    h+=`<tr><td>${qi+1}번 문장</td><td style="${sty}">${res}</td><td>${att}</td></tr>`;
  }
  h+='</table></div>';
  $('app').innerHTML=h;
}

// ── 포털에서 넘어온 학생 자동 로그인 (이중 로그인 제거) ──
(function(){
  try{
    const qp=new URLSearchParams(location.search);
    let nm=(qp.get('student')||'').trim();
    if(!nm){ nm=(sessionStorage.getItem('sf_student')||'').trim(); }
    if(nm){
      sessionStorage.setItem('sf_student',nm);
      S.name=nm; S.screen='home';
    }
  }catch(e){}
})();

R();
